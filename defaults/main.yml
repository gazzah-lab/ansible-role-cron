---
# defaults file for gazzah.cron

cron_packages:
  - cron

# Liste des jobs. Un fichier /etc/cron.d/<cron_file> est généré par valeur
# distincte de cron_file, contenant tous les jobs qui la partagent.
# Chaque job accepte : name, cron_file, job, user, minute, hour, day, month,
# weekday, special_time, disabled.
cron_jobs: []

# true : toutes les lignes sont générées commentées, quel que soit le
# disabled de chaque job (ex. serveur hors production).
cron_jobs_disabled: false

cron_config_dir: /etc/cron.d
cron_default_user: root
cron_file_mode: "0644"

# Marqueur écrit en tête de chaque fichier géré ; seuls les fichiers qui le
# portent sont supprimés quand ils disparaissent de cron_jobs.
cron_managed_marker: "ANSIBLE MANAGED - gazzah.cron"
cron_remove_orphans: true

# Fichiers de cron_config_dir gérés par un autre outil (autre équipe, script
# de déploiement) : jamais écrits ni supprimés par le rôle. Un cron_file de
# cron_jobs présent dans cette liste est refusé.
cron_foreign_files: []

cron_service: cron

cron_apt_install_state: present
cron_apt_update_cache: true
cron_apt_cache_valid_time: 3600

# Explicit opt-in before deleting all previously managed jobs.
cron_allow_empty: false
cron_manage_service: true
